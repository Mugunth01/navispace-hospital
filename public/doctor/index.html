<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doctor Portal</title>
<link rel="stylesheet" href="../admin/admin.css">
<link rel="stylesheet" href="doctor.css">
</head>
<body class="dp">
<header class="dpbar">
  <div class="logo"><svg class="ic" viewBox="0 0 16 16"><path d="M6 1.5h4v4.5h4.5v4H10v4.5H6V10H1.5V6H6z"/></svg></div>
  <div class="atitle" id="dp-title">Doctor portal<small id="dp-sub"></small></div>
  <div class="spacer"></div>
  <button class="tbtn" id="dp-out" hidden>Sign out</button>
</header>
<nav class="dptabs" id="dp-tabs" hidden role="tablist">
  <button data-tab="today" aria-selected="true">Today</button><button data-tab="upcoming" aria-selected="false">Upcoming</button>
  <button data-tab="past" aria-selected="false">Past</button><button data-tab="leave" aria-selected="false">Leave</button><button data-tab="profile" aria-selected="false">Profile</button>
</nav>
<main class="dpmain" id="dp-main"></main>
<div class="toast" id="toast" role="status" hidden></div>
<div class="login" id="login" hidden>
  <form class="lcard" id="lform">
    <div class="logo"><svg class="ic" viewBox="0 0 16 16"><path d="M6 1.5h4v4.5h4.5v4H10v4.5H6V10H1.5V6H6z"/></svg></div>
    <h2>Doctor portal</h2>
    <p class="lsub">Sign in with the email and password the hospital admin gave you.</p>
    <label class="field"><span class="lbl">Email</span><input id="email" type="email" autocomplete="username" required></label>
    <label class="field"><span class="lbl">Password</span><input id="pw" type="password" autocomplete="current-password" minlength="6" required></label>
    <button class="primary" type="submit">Sign in</button>
    <p class="lmsg" id="lmsg"></p>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../admin/config.js"></script>
<script src="doctor.js"></script>
</body>
</html>
